spring.application.name=helpdesk
server.port=8080

# ---- MySQL (change username/password or set DB_USERNAME / DB_PASSWORD env vars) ----
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA / Hibernate: tables are created automatically ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Default admin (created on first start if no admin exists). CHANGE THE PASSWORD. ----
helpdesk.admin.name=System Admin
helpdesk.admin.email=admin@helpdesk.com
helpdesk.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---- Email notifications (optional). In-app notifications always work. ----
helpdesk.mail.enabled=false
helpdesk.mail.from=no-reply@helpdesk.local
